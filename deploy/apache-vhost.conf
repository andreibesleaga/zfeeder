# zFeeder: document root rules. Included as a conf-available fragment by the image,
# and usable as-is inside a <VirtualHost> on a normal server.

<Directory /var/www/html/public>
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On
    # Serve real files and directories directly.
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    # Everything else is the front controller.
    RewriteRule ^ index.php [L]
</Directory>

# The data directory must never be reachable over HTTP, wherever it is mounted.
<Directory /var/www/data>
    Require all denied
</Directory>

<IfModule mod_headers.c>
    <FilesMatch "\.(css|js|png|gif|jpg|jpeg|svg|woff2)$">
        Header set Cache-Control "public, max-age=604800, immutable"
    </FilesMatch>
    <FilesMatch "\.(json|opml|xml)$">
        Header set Cache-Control "no-store"
    </FilesMatch>
</IfModule>

# Block access to anything that is not meant to be served, belt and braces.
<FilesMatch "^(composer\.(json|lock)|\.env.*|.*\.md|.*\.sqlite|.*\.log)$">
    Require all denied
</FilesMatch>

# /.well-known/sustainability-data (draft-besleaga-sustainability-wellknown): a static, signed
# report of this deployment's footprint, refreshed monthly by the operator. Served as a real file
# by the rewrite rules above; this block only gives it its media type and headers.
<Location "/.well-known/sustainability-data">
    ForceType application/sustainability-data+json
    <IfModule mod_headers.c>
        Header set Access-Control-Allow-Origin "*"
        Header set Cache-Control "public, max-age=3600"
        Header set X-Content-Type-Options "nosniff"
    </IfModule>
</Location>
