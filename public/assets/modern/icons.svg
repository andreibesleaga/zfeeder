<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false">
  <!--
    zFeeder 2.0 icon sprite. Every icon is a 24x24 <symbol> that paints with
    fill="currentColor", so it takes the colour of the button it sits in.

    Use:
      <svg class="zfa-icon" aria-hidden="true"><use href="assets/modern/icons.svg#zfi-save"></use></svg>
    Always aria-hidden with a real text label beside it; these icons never
    carry meaning on their own.
  -->

  <symbol id="zfi-add" viewBox="0 0 24 24" fill="currentColor">
    <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/>
  </symbol>

  <symbol id="zfi-delete" viewBox="0 0 24 24" fill="currentColor">
