<!--
	zFeeder 2.0 template: aqua
	A solid aqua title bar over compact one-line-plus-summary rows; the 2004 gradient
	bar becomes a flat accent bar that keeps its contrast in dark mode.
	Descends from: classic/aqua (2004, AB).
-->

<!-- zFeeder template header -->
<link rel="stylesheet" href="{scripturl}assets/modern/zf.css">
<!-- ENDzFeeder template header -->

<!-- header -->
<section class="zf zf--aqua zf-feed" id="zfchannel{position}" aria-labelledby="zf-chan-{feedid}">
<!-- ENDheader -->

<!-- channel -->
	<div class="zf-bar zf-bar--solid">
		<div class="zf-bar__head">
			<h2 class="zf-bar__title" id="zf-chan-{feedid}"><a href="{chanlink}" title="{chandesc}">{chantitle}</a></h2>
		</div>
		<div class="zf-bar__tools">
			<a class="zf-tool" href="{moreurl}">More</a>
			<a class="zf-tool" href="{feedurl}">XML</a>
		</div>
	</div>
	<ul class="zf-items zf-items--rows">
<!-- ENDchannel -->

<!-- news -->
		<li class="zf-item">
			<h3 class="zf-item__title"><time class="zf-item__time" datetime="{itemdate_iso}">{pubdate}</time> <a href="{link}">{title}</a></h3>
			<div class="zf-item__desc">{description|trunc:300}</div>
		</li>
<!-- ENDnews -->

<!-- footer -->
	</ul>
</section>
<!-- ENDfooter -->

<!-- between -->
<div class="zf"><hr class="zf-sep"></div>
<!-- ENDbetween -->
