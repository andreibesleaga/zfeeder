<!--
	zFeeder 2.0 template: ticker
	A single horizontal strip of headlines for a site header or footer; it scrolls
	inside itself, never widening the page, and carries no animation.
	Descends from: nothing in 1.6 - this is one of the three new 2.0 templates.
-->

<!-- zFeeder template header -->
<link rel="stylesheet" href="{scripturl}assets/modern/zf.css">
<!-- ENDzFeeder template header -->

<!-- header -->
<section class="zf zf--ticker zf-feed" id="zfchannel{position}" aria-labelledby="zf-chan-{feedid}">
	<div class="zf-ticker">
<!-- ENDheader -->

<!-- channel -->
		<h2 class="zf-ticker__label" id="zf-chan-{feedid}"><a href="{chanlink}">{chantitle}</a></h2>
		<ul class="zf-ticker__track">
<!-- ENDchannel -->

<!-- news -->
			<li class="zf-ticker__item"><a href="{link}">{title}</a><time class="zf-sr" datetime="{itemdate_iso}">{pubdate}</time></li>
<!-- ENDnews -->

<!-- footer -->
		</ul>
	</div>
</section>
<!-- ENDfooter -->

<!-- between -->
<!-- ENDbetween -->
