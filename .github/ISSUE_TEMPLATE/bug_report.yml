name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security problems here — follow [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. ...
        2. ...
    validations: { required: true }
  - type: textarea
    id: checkconfig
    attributes:
      label: Output of `bin/zfeeder check-config`
      description: It redacts secrets. Paste the whole thing.
      render: text
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: zFeeder version
      placeholder: 2.0.0, or a commit hash
    validations: { required: true }
  - type: dropdown
    id: storage
    attributes:
      label: Storage backend
      options: [flat, sqlite]
    validations: { required: true }
  - type: input
    id: php
    attributes:
      label: PHP version and how it is served
      placeholder: 8.3.6, Apache in the official container
    validations: { required: true }
