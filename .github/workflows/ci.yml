name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, simplexml, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
      - name: Coding standard
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Architecture boundaries
        run: vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress
      - name: Forbidden constructs
        run: ./tools/check-forbidden.sh
      - name: Diagrams
        run: php tools/check-diagrams.php

  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.storage }} storage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        storage: [flat, sqlite]
    env:
      ZF_STORAGE: ${{ matrix.storage }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, simplexml, pdo_sqlite, sqlite3
          coverage: pcov
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Unit, integration, golden, security and CLI tests
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml
      - name: Enforce coverage floor
        if: matrix.php == '8.3' && matrix.storage == 'flat'
        run: php tools/coverage-gate.php coverage.xml 90
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3' && matrix.storage == 'flat'
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Known vulnerabilities in dependencies
        run: composer audit --no-interaction
      # The gitleaks action derives a commit range from the push event, which
      # has no valid form for the first push to a repository and breaks again
      # after any history rewrite. The whole history is scanned instead: it is
      # the question worth asking, and the answer does not depend on how the
      # commits arrived. The binary is pinned and its checksum verified.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o /tmp/gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner --exit-code=1

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: zfeeder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: ./tools/smoke-image.sh zfeeder:ci

  e2e:
    name: Browser tests and accessibility
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The pages under test run in the container, but the harness runs on the
      # runner: it hashes the demo password and seeds a deterministic cache
      # through the application's own storage code, so it needs PHP and the
      # autoloader here as well.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, simplexml, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: zfeeder:ci
          cache-from: type=gha
      - name: Install browser test tooling
        run: npm ci --prefix tests/e2e || npm install --prefix tests/e2e
      - run: npx --prefix tests/e2e playwright install --with-deps chromium
      - name: Run end to end suite
        run: ./tools/run-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            test-results/
            docs/portfolio/img/2026/
          retention-days: 14
