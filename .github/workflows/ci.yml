name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, simplexml, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Validate composer.json
        run: composer validate --strict --no-check-publish
      - name: Coding standard
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --show-progress=none
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Architecture boundaries
        run: vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress
      - name: Forbidden constructs
        run: ./tools/check-forbidden.sh

  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.storage }} storage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        storage: [flat, sqlite]
    env:
      ZF_STORAGE: ${{ matrix.storage }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, simplexml, pdo_sqlite, sqlite3
          coverage: pcov
          tools: composer:v2
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Unit, integration, golden, security and CLI tests
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml
      - name: Enforce coverage floor
        if: matrix.php == '8.3' && matrix.storage == 'flat'
        run: php tools/coverage-gate.php coverage.xml 90
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3' && matrix.storage == 'flat'
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  security:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Known vulnerabilities in dependencies
        run: composer audit --no-interaction
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: zfeeder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: ./tools/smoke-image.sh zfeeder:ci

  e2e:
    name: Browser tests and accessibility
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: zfeeder:ci
          cache-from: type=gha
      - name: Install browser test tooling
        run: npm ci --prefix tests/e2e || npm install --prefix tests/e2e
      - run: npx --prefix tests/e2e playwright install --with-deps chromium
      - name: Run end to end suite
        run: ./tools/run-e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: |
            test-results/
            docs/portfolio/img/2026/
          retention-days: 14
