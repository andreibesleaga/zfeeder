name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  security-events: write
  contents: read
  # The analyse action reads its own workflow run to attach the results to it.
  # Without this it uploads the SARIF and then fails on "Resource not
  # accessible by integration".
  actions: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          # PHP is not a CodeQL language; the JavaScript analysis covers the
          # vendored htmx bundle and the browser test suite. PHP is checked by
          # PHPStan at level 8 with the strict rules, plus the forbidden
          # constructs scan, both in the CI workflow.
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
